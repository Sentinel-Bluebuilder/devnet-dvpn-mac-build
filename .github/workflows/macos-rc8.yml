# ─── macos-rc8 (version-neutral; file name kept for dispatch) — the package.json version on real Apple
#     silicon (GitHub macos-15): build + unit tests, then live. rc.9+ = bump #33, export, one dispatch. ───
# build: npm ci, typecheck, unit tests, release:mac --arch arm64 (unsigned ad hoc: identity null +
#        build/mac/adhoc-sign.cjs; CSC_IDENTITY_AUTO_DISCOVERY=false), SHA256SUMS, artifacts.
#        The pinned darwin dvpnd + patched xray (build/deps.lock.json "local") are not in git; they are
#        taken from the public rc.4 arm64 .zip, built from the same final6.16 (5b0a398). If the shipped
#        bytes differ from the lock (codesign re-signs Mach-O), this CI checkout's lock is pointed at
#        the shipped bytes and the run summary says so: daemon = the rc.4-shipped final6.16 bytes.
#        Guard: if the lock's arm64 dvpnd/xray src is no longer that final6.16/ddv2 pair (a new daemon in
#        a later rc), the step FAILS instead of shipping the old rc.4 bytes under a new lock.
# live:  install the .dmg with sudo, link the CLI, run scripts/e2e/mac/gha-live.sh (owned by AC-MAC-2)
#        with secrets.DVPN_TEST_KEY in a 0600 file; upload evidence/.
name: macos-rc8

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the live job after build'
        type: boolean
        default: true
      artifact_run:
        description: 'Live only: install the .dmg/.zip of this earlier run id (its build is the one published); empty = build here'
        type: string
        default: ''

permissions:
  contents: read
  actions: read   # live from an earlier run: download-artifact reads that run's artifacts

env:
  RC4_REPO: Sentinel-Bluebuilder/sentinel-solana-dvpn-macos
  RC4_TAG: v0.3.0-rc4
  RC4_ZIP: Devnet-dVPN-0.3.0-rc.4-arm64-mac.zip
  RC4_DVPND_SRC: sentinel-dvpnd-darwin-arm64-fork-cb33-4-final6.16
  RC4_XRAY_SRC: xray-darwin-arm64-26.3.27-ddv2
  # #33 audit M1 (rc.9): the ONLY bytes the CI lock override may take (the rc.4-shipped, signed final6.16 dvpnd + xray;
  # hub tests/walk/macos-rc7-deps.md). Anything else in the rc.4 zip fails the build.
  RC4_DVPND_SHA: cfc3781087c96fb2174b4a334e12b19d99ff1b32420dcd7e46ab20d01a60f3d1
  RC4_XRAY_SHA: 3daa86e2b427bbf85426555a500fcbba2d96f4674ca78f80dad3c22836fafbd5
  DVPND_DIR: ${{ github.workspace }}/.ci-dvpnd
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

# #33 audit M2 (rc.9): GitHub runs a bare `run:` as `bash -e {0}`, so a failing command before a pipe (`… | tee`) did not
# fail the step (a type error passed the build). `shell: bash` = `bash --noprofile --norc -eo pipefail {0}`.
defaults:
  run:
    shell: bash

jobs:
  build:
    # rc.9 (lead): a live-only re-run installs an earlier run's packages, so the published files are the tested ones.
    if: ${{ inputs.artifact_run == '' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # node-gyp (electron-builder's native rebuild of bigint-buffer) imports distutils, which
      # Python 3.12+ removed; macos-15 ships 3.12+. 3.11 still has it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Version (package.json)
        run: echo "### Devnet dVPN $(jq -r .version package.json) — macOS arm64" >> "$GITHUB_STEP_SUMMARY"

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run -s typecheck 2>&1 | tee typecheck.log

      - name: Unit tests
        run: |
          set -o pipefail
          npx vitest run tests/unit tests/platform 2>&1 | tee unit-tests.log

      - name: Pinned darwin binaries from the rc.4 arm64 zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "dvpnd:$RC4_DVPND_SRC" "xray:$RC4_XRAY_SRC"; do
            n=${pair%%:*}; want_src=${pair#*:}
            have=$(jq -r --arg n "$n" '.local[] | select(.arch=="arm64" and .name==$n) | .src' build/deps.lock.json)
            [ "$have" = "$want_src" ] || { echo "lock arm64 $n src is '$have', not the rc.4-shipped '$want_src': supply the new build, this binary source no longer applies"; exit 1; }
          done
          mkdir -p "$DVPND_DIR" /tmp/rc4
          gh release download "$RC4_TAG" -R "$RC4_REPO" -p "$RC4_ZIP" -D /tmp/rc4
          shasum -a 256 "/tmp/rc4/$RC4_ZIP" | tee -a "$GITHUB_STEP_SUMMARY"
          ditto -x -k "/tmp/rc4/$RC4_ZIP" /tmp/rc4/x
          res="$(find /tmp/rc4/x -type d -path '*Devnet dVPN.app/Contents/Resources/resources/bin' | head -1)"
          test -n "$res" || { echo "no resources/bin in the rc.4 app"; exit 1; }
          echo '### Pinned darwin binaries' >> "$GITHUB_STEP_SUMMARY"
          for name in dvpnd xray; do
            src=$(jq -r --arg n "$name" '.local[] | select(.arch=="arm64" and .name==$n) | .src' build/deps.lock.json)
            rel=$(jq -r --arg n "$name" '.local[] | select(.arch=="arm64" and .name==$n) | .path' build/deps.lock.json)
            want=$(jq -r --arg n "$name" '.local[] | select(.arch=="arm64" and .name==$n) | .sha256' build/deps.lock.json)
            from="$res/${rel#resources/bin/}"
            test -f "$from" || { echo "rc.4 app has no ${rel#resources/bin/}"; exit 1; }
            cp "$from" "$DVPND_DIR/$src"
            got=$(shasum -a 256 "$DVPND_DIR/$src" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              cp "$from" /tmp/rc4/unsigned && codesign --remove-signature /tmp/rc4/unsigned || true
              ug=$(shasum -a 256 /tmp/rc4/unsigned | cut -d' ' -f1)
              if [ "$ug" = "$want" ]; then
                cp /tmp/rc4/unsigned "$DVPND_DIR/$src"; got=$ug
                echo "- $name: lock match after codesign --remove-signature ($got)" >> "$GITHUB_STEP_SUMMARY"
              else
                # CI-only lock override: the bytes users run today in rc.4 (same final6.16 build), and ONLY those.
                # #33 audit M1: before, any bytes in the downloaded zip became the lock; now they must equal the pin.
                case "$name" in dvpnd) pin="$RC4_DVPND_SHA" ;; xray) pin="$RC4_XRAY_SHA" ;; *) pin='' ;; esac
                if [ -z "$pin" ] || [ "$got" != "$pin" ]; then
                  echo "$name in the rc.4 zip is $got, not the pinned rc.4 bytes ${pin:-none} (lock $want, unsigned $ug): refusing to build"
                  echo "- $name: **REFUSED** — rc.4 zip bytes $got are not the pinned ${pin:-none}" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                jq --arg n "$name" --arg s "$got" '(.local[] | select(.arch=="arm64" and .name==$n) | .sha256) = $s' \
                  build/deps.lock.json > /tmp/lock.json && mv /tmp/lock.json build/deps.lock.json
                echo "- $name: **CI lock override** — daemon/xray = the rc.4-shipped final6.16 bytes, sha256 $got (lock pinned $want; unsigned $ug)" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "- $name: lock match ($got)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: release:mac (arm64)
        env:
          # CI has no stable self-signed identity (lead decision): ad hoc sign. The app's Keychain
          # identity differs from a release-signed build, so this .dmg is test evidence, not an update.
          DVPN_MAC_ADHOC: '1'
        run: |
          set -o pipefail
          node scripts/release-mac.mjs --arch arm64 --skip-tests --allow-same-version 2>&1 | tee release.log

      - name: SHA-256
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.dmg *.zip | tee SHA256SUMS
          { echo '### Packages (arm64, ad hoc signed, not notarized)'; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.txt
            typecheck.log
            unit-tests.log
            release.log

  live:
    needs: build
    if: ${{ always() && inputs.live && (needs.build.result == 'success' || (inputs.artifact_run != '' && needs.build.result == 'skipped')) }}
    runs-on: macos-15
    # Shared with macos-pathb.yml: never two devnet chain tests at once (sequential chain rule).
    concurrency:
      group: devnet-chain
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: pkg
          run-id: ${{ inputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Packages under test
        run: |
          echo "### Packages under test (from run ${{ inputs.artifact_run || github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; cat pkg/dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat pkg/dist/SHA256SUMS

      - name: Install the .dmg (sudo)
        run: |
          set -euo pipefail
          (cd pkg/dist && shasum -a 256 -c SHA256SUMS)
          dmg=$(ls pkg/dist/*.dmg | head -1)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -1)
          sudo rm -rf "/Applications/Devnet dVPN.app"
          sudo ditto "$mnt/Devnet dVPN.app" "/Applications/Devnet dVPN.app"
          hdiutil detach "$mnt"
          sudo xattr -dr com.apple.quarantine "/Applications/Devnet dVPN.app"
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "/Applications/Devnet dVPN.app/Contents/Resources/bin/devnet-dvpn" /usr/local/bin/devnet-dvpn
          devnet-dvpn version --json

      - name: Drivers (Homebrew, as the user)
        run: brew install wireguard-tools wireguard-go openvpn bash jq || true

      - name: Live rows (gha-live.sh)
        env:
          DVPN_TEST_KEY: ${{ secrets.DVPN_TEST_KEY }}
          EXTRA_ROWS_FILE: scripts/e2e/mac/gha-mac-rows.sh
        run: |
          set -euo pipefail
          test -n "$DVPN_TEST_KEY" || { echo "secret DVPN_TEST_KEY is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/dvpn-test-key.json"
          printf '%s' "$DVPN_TEST_KEY" > "$key"
          chmod 600 "$key"
          EXPECT_VERSION=$(jq -r .version package.json) DVPN_KEYFILE="$key" bash scripts/e2e/mac/gha-live.sh

      # Lead rc.9: a cancelled run strands 0. GitHub runs if: always() steps after a cancel too, so this pass revokes and
      # sweeps the device key if the script's own EXIT trap never ran, and empties every throwaway wallet key the rows
      # left in $RUNNER_TEMP/ddv-leftover (wallet_switch B) to the owner before the runner is thrown away.
      - name: Leftover sweep (always, also after a cancel)
        if: always()
        env:
          EXTRA_ROWS_FILE: scripts/e2e/mac/gha-mac-rows.sh
        run: |
          key="$RUNNER_TEMP/dvpn-test-key.json"
          test -f "$key" || { echo 'no test key on this runner: nothing was funded'; exit 0; }
          command -v devnet-dvpn >/dev/null || { echo 'the app was never installed: nothing was funded'; exit 0; }
          CLEANUP_ONLY=1 EXPECT_VERSION=$(jq -r .version package.json) DVPN_KEYFILE="$key" bash scripts/e2e/mac/gha-live.sh
          left=$(ls "$RUNNER_TEMP/ddv-leftover" 2>/dev/null | wc -l | tr -d ' ')
          echo "### Leftover keys after the sweep: $left" >> "$GITHUB_STEP_SUMMARY"
          test "$left" = 0 || { echo "::error::$left throwaway wallet key(s) could not be emptied (see evidence/leftover.out)"; exit 1; }

      - name: Result
        if: always()
        run: test -f evidence/RESULT.md && cat evidence/RESULT.md >> "$GITHUB_STEP_SUMMARY" || echo 'no RESULT.md' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-live-evidence
          path: evidence/

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/dvpn-test-key.json"
